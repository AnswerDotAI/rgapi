name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: AnswerDotAI/.github/actions/setup-uv@main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo test
      - run: uv pip install --system -e '.[test]'
      - run: pytest -q

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@v1
        with:
          args: --profile dist --out dist ${{ runner.os == 'Linux' && '--zig' || '' }}
          manylinux: '2_31'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish -p rgapi --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
