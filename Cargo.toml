[package]
name = "rgapi"
version = "0.1.24"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Python API for ripgrep-style file walking and searching"
repository = "https://github.com/AnswerDotAI/rgapi"
homepage = "https://github.com/AnswerDotAI/rgapi"
documentation = "https://github.com/AnswerDotAI/rgapi"

[lib]
name = "rgapi"
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1"
globset = ">=0.4.20"
grep-matcher = ">=0.1.9"
grep-regex = ">=0.1.14"
grep-searcher = ">=0.1.17"
ignore = ">=0.4.33"
pyo3 = { version = ">=0.29.2, <0.30", optional = true }
serde = { version = "=1", features = ["derive"] }
serde_json = "=1"

[features]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[lints.clippy]
too_many_arguments = "allow"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.rgapi]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.rgapi]
incremental = false
